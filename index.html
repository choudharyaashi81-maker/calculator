<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="calculator">
    <h2>My Calculator</h2>
    <p class="subtitle">Simple • Smart • Fast</p>

    <input
      type="text"
      id="display"
      placeholder="0"
      readonly
      aria-label="Calculator display"
    >

    <div class="buttons">
      <button type="button" class="special" data-action="clear">AC</button>
      <button type="button" class="special" data-action="delete">DEL</button>
      <button type="button" class="operator" data-value="%">%</button>
      <button type="button" class="operator" data-value="/">÷</button>

      <button type="button" data-value="7">7</button>
      <button type="button" data-value="8">8</button>
      <button type="button" data-value="9">9</button>
      <button type="button" class="operator" data-value="*">×</button>

      <button type="button" data-value="4">4</button>
      <button type="button" data-value="5">5</button>
      <button type="button" data-value="6">6</button>
      <button type="button" class="operator" data-value="-">−</button>

      <button type="button" data-value="1">1</button>
      <button type="button" data-value="2">2</button>
      <button type="button" data-value="3">3</button>
      <button type="button" class="operator" data-value="+">+</button>

      <button type="button" data-value="0" class="zero">0</button>
      <button type="button" data-value=".">.</button>
      <button type="button" class="equal" data-action="calculate">=</button>
    </div>

    <p class="footer">Made with HTML, CSS & JavaScript</p>
  </div>
</body>
</html>
